# ⚠️ Note to Gitee and other platform visitors:
# This is the workflow configuration file for GitHub Actions.
# It is used to automatically build the APK on GitHub's cloud servers.
# If you don't need this, please just ignore it. Thanks!
name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: project

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PCLA_Alpha0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCLA_Alpha0.1.0
          path: project/app/build/outputs/apk/debug/PCLA_Alpha0.1.0.apk
