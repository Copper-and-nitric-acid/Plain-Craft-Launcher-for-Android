# PCLA · GitHub Actions 构建
#
# 设计要点：
#   1. 拆两个 job：先跑纯 JVM 自检（不装 Android SDK），再打 APK。自检挂了几十秒就能看到。
#   2. 不依赖仓库里的 gradlew（权限 644、从未在 CI 实跑过），改用 setup-gradle 指定 8.9。
#   3. 每个命令带 --stacktrace，失败日志才有堆栈。
#   4. 不重命名 APK，直接上传 *.apk，避免 mv 找不到文件连带上传失败。

name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: 纯逻辑自检
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: 环境信息
        run: |
          java -version
          gradle --version

      - name: 编译 core 并跑自检
        working-directory: project
        run: gradle :core:selfTest --no-daemon --stacktrace

  apk:
    name: 打 Debug APK
    needs: core-check
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - name: 装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: 环境信息
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: 构建 Debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 看看产出了什么
        if: always()
        run: |
          find project/app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "没有 APK"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: PCLA-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            project/**/build/reports/**
          if-no-files-found: warn
          retention-days: 7
